# Install once with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: ^src/
      - id: watchlist
        name: watch list is generated from the registry
        entry: uv run mbn watchlist --check
        language: system
        pass_filenames: false
        files: ^src/mbn/findings/
