[project]
name = "mbn"
version = "1.0.0"
description = "Morocco by the Numbers: checked findings from data.gov.ma open data"
readme = "README.md"
license = { text = "MIT (code); ODbL (data)" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pandera>=0.24",
]

[project.scripts]
mbn = "mbn.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-bdd>=8",
    "pytest-cov>=6",
    "hypothesis>=6.100",
    "syrupy>=4.8",
    "pytest-playwright>=0.6",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pre-commit>=4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbn"]

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM108", "E731"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/mbn"]
plugins = ["pandera.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "xlrd.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:cacheprovider"
filterwarnings = ["ignore:Workbook contains no default style:UserWarning"]
bdd_features_base_dir = "tests/features"
markers = [
    "datasets: needs the downloaded portal files (set MBN_DATASETS); skipped otherwise",
    "e2e: browser tests (Playwright)",
]

[tool.coverage.run]
source = ["mbn"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
