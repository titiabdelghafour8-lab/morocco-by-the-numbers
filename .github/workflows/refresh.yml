name: Monthly data refresh

# Rebuilds the site from the latest data.gov.ma files. It never changes the live site:
# if any figure changed, it pushes a review branch and opens an issue so the text can be
# checked before merging.
on:
  schedule:
    - cron: "0 6 3 * *"   # 06:00 UTC on the 3rd of each month
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download the portal
        run: python scripts/01_download.py datasets

      - name: Rebuild figures and page
        run: |
          python scripts/02_extract.py datasets
          python scripts/02b_extract_more.py datasets
          python scripts/02c_extract_services.py datasets
          python scripts/03_build.py datasets
          python scripts/03b_build_more.py
          cp data/morocco_by_the_numbers.json /tmp/old.json
          python scripts/04_pack.py datasets
          python scripts/05_render.py

      - name: Check the page still has every chart
        run: |
          expected=$(grep -o 'class="chart" id="c-[a-z-]*"' scripts/template.html | wc -l)
          found=$(grep -o 'class="chart" id="c-[a-z-]*"' index.html | wc -l)
          test "$expected" -eq "$found"
          grep -q '"src"' index.html

      - name: Compare with the published figures
        id: compare
        run: python scripts/06_compare.py /tmp/old.json data/morocco_by_the_numbers.json summary.md >> "$GITHUB_OUTPUT"

      - name: Check the numbers quoted in the text
        if: steps.compare.outputs.changed == 'true'
        run: |
          { echo ""; echo "### Claims check"; echo ""; echo '```'; python scripts/07_check_claims.py || true; echo '```'; } >> summary.md

      - name: Push a review branch and open an issue
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="data-refresh-$(date -u +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add index.html data/morocco_by_the_numbers.json
          git commit -m "Refresh data from data.gov.ma ($(date -u +%Y-%m-%d))"
          git push -f origin "$branch"
          echo "" >> summary.md
          echo "Review branch: \`$branch\`" >> summary.md
          gh issue create --title "New data available ($(date -u +%Y-%m))" --body-file summary.md
